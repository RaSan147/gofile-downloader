[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gofile-downloader"
version = "0.1.0"
description = "Download files from https://gofile.io"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.1",
    "rich>=13.0.0",
]

[project.scripts]
gofile-downloader = "gofile_downloader:main"

[tool.setuptools]
py-modules = ["gofile_downloader", "terminal_ui"]
